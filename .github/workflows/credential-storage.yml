name: Credential storage
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  credentials:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Native credentials (macOS and Windows)
        if: runner.os != 'Linux'
        run: npm run test:credentials
      - name: Install Linux credential service
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus dbus-x11
      - name: Native Linux credentials
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -ec 'printf %s dummy-keyring-password | gnome-keyring-daemon --unlock >/dev/null; npm run test:credentials'
      - name: Unavailable Linux credential service
        if: runner.os == 'Linux'
        run: node scripts/test-credential-store.mjs --unavailable
