name = "settleup"
main = "src/index.mjs"
compatibility_date = "2024-11-06"

[env.staging]
name = "settleup-staging"
vars = { SETTLEUP_ENV = "staging" }

[[env.staging.ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "12001"

  [env.staging.ratelimits.simple]
  limit = 10
  period = 60

[env.production]
name = "settleup-production"
vars = { SETTLEUP_ENV = "production" }

[[env.production.ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "12002"

  [env.production.ratelimits.simple]
  limit = 10
  period = 60
